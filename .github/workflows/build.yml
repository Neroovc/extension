name: Build Extensions
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate index.min.json
        run: python3 -c "import json; json.dump(json.load(open('index.json')), open('index.min.json','w'), separators=(',',':'))"

      - name: Build all extensions
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease

      - name: Rename APKs to keiyoushi convention
        run: |
          for apk in src/all/*/build/outputs/apk/release/*-release.apk; do
            ext=$(echo "$apk" | sed 's|src/all/||;s|/build/outputs/apk/release/.*||')
            dir=$(dirname "$apk")
            mv "$apk" "$dir/tachiyomi-all.$ext-v1.0.0.apk"
            echo "Renamed: $apk -> $dir/tachiyomi-all.$ext-v1.0.0.apk"
          done

      - name: Delete old latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Build"
          artifacts: "src/all/*/build/outputs/apk/release/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
          body: "Automated build from master branch."

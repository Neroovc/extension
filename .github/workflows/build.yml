name: Build Extensions
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore cached signing keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: signing-keystore-v1

      - name: Generate signing keystore (if not cached)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Extensions,O=Extensions,C=US"

      - name: Extract signing key hash
        id: signing_key
        run: |
          HASH=$(keytool -list -v -keystore release.keystore \
            -storepass android -alias release -keypass android \
            | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Signing key: $HASH"

      - name: Update index.json with signing key
        run: |
          HASH="${{ steps.signing_key.outputs.hash }}"
          CURRENT=$(grep '"signingKey"' index.json | awk -F'"' '{print $4}' 2>/dev/null || echo "")
          if [ "$CURRENT" != "$HASH" ]; then
            # Remove existing signingKey line if present
            sed -i '/"signingKey"/d' index.json
            # Insert after badgeLabel
            sed -i '0,/^  "badgeLabel":/a\  "signingKey": "'"$HASH"'",' index.json
            echo "signingKey updated to $HASH"
          else
            echo "signingKey already matches, skipping"
          fi

      - name: Build all extensions
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "src/all/*/build/outputs/apk/release/*.apk"

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: update signing key in index.json [skip ci]"
          git push
